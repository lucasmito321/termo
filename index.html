<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090c11">
    <title>TERMO // Setor 07</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="interface">
        <header class="topbar">
            <span class="status"><span class="status-light"></span> SISTEMA ATIVO</span>
            <span class="sector">DISTRITO 07 · 2049</span>
        </header>

        <section class="game-panel" aria-labelledby="game-title">
            <p class="eyebrow">PROTOCOLO DE RECUPERAÇÃO DE PALAVRAS</p>
            <h1 id="game-title">TERMO<span class="title-mark">//</span></h1>
            <p class="intro">A cidade caiu. As palavras permanecem.</p>
            <p class="instructions">Descubra a palavra de cinco letras. O sinalizador indica as letras corretas.</p>

            <div id="jogo" aria-label="Área do jogo"></div>

            <section class="used-letters" aria-labelledby="used-letters-title">
                <h2 id="used-letters-title">FREQUÊNCIAS DETECTADAS</h2>
                <div id="letrasUtilizadas" aria-live="polite"></div>
            </section>
        </section>

        <footer class="footer-note">
            <span>REDE LOCAL // CONEXÃO INSTÁVEL</span>
            <span>✦</span>
            <span>PERMANEÇA EM SILÊNCIO</span>
        </footer>
    </main>
    <script src="termo.js"></script>
</body>
</html>
